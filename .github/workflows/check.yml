# Проверка кода на каждый пуш и пулл-реквест:
#   rojo build      — проект собирается в файл места (его можно скачать: ro1-place)
#   check_scene     — сцена соответствует договорённостям кода
#   автотесты       — серверный код в симуляторе Roblox (tests/, Lune)
#   luau-lsp        — типы в строгом режиме с описаниями API Roblox + линтер
#   StyLua          — форматирование по stylua.toml
#   selene          — линтер для Roblox
# Версии инструментов берутся из rokit.toml.

name: Проверка кода

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Luau
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Установка инструментов из rokit.toml
        run: |
          # Версия инструмента из строки вида: rojo = "rojo-rbx/rojo@7.4.4"
          version() { sed -n "s/^$1 *= *\"[^@]*@\(.*\)\"/\1/p" rokit.toml; }
          ROJO=$(version rojo); SELENE=$(version selene); STYLUA=$(version stylua); LUAU_LSP=$(version luau-lsp); LUNE=$(version lune)
          echo "rojo $ROJO, selene $SELENE, stylua $STYLUA, luau-lsp $LUAU_LSP, lune $LUNE"

          BIN="$RUNNER_TEMP/bin"
          mkdir -p "$BIN"
          get() { curl -fsSL "$1" -o "$RUNNER_TEMP/tool.zip" && unzip -o -q "$RUNNER_TEMP/tool.zip" -d "$BIN"; }
          get "https://github.com/rojo-rbx/rojo/releases/download/v$ROJO/rojo-$ROJO-linux-x86_64.zip"
          get "https://github.com/Kampfkarren/selene/releases/download/$SELENE/selene-$SELENE-linux.zip"
          get "https://github.com/JohnnyMorganz/StyLua/releases/download/v$STYLUA/stylua-linux-x86_64.zip"
          get "https://github.com/JohnnyMorganz/luau-lsp/releases/download/$LUAU_LSP/luau-lsp-linux-x86_64.zip"
          get "https://github.com/lune-org/lune/releases/download/v$LUNE/lune-$LUNE-linux-x86_64.zip"
          chmod +x "$BIN"/*
          echo "$BIN" >> "$GITHUB_PATH"

          # Описания API Roblox для luau-lsp (уровень доступа обычных скриптов игры).
          curl -fsSL -o "$RUNNER_TEMP/globalTypes.d.luau" \
            https://raw.githubusercontent.com/JohnnyMorganz/luau-lsp/main/scripts/globalTypes.None.d.luau

      # Следующие шаги выполняются, даже если предыдущая проверка упала:
      # так за один запуск видны все проблемы сразу.
      - name: Сборка (rojo build)
        id: build
        if: ${{ !cancelled() }}
        run: rojo build default.project.json -o "$RUNNER_TEMP/ro1.rbxlx"

      - name: Проверка сцены
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 tools/check_scene.py "$RUNNER_TEMP/ro1.rbxlx"

      - name: Автотесты (симулятор сервера)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: lune run tests/run.luau "$RUNNER_TEMP/ro1.rbxlx"

      # Готовый файл места: Actions → запуск → Artifacts → ro1-place.
      - name: Файл места для Studio
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v5
        with:
          name: ro1-place
          path: ${{ runner.temp }}/ro1.rbxlx
          if-no-files-found: error
          retention-days: 30

      - name: Типы и линтер (luau-lsp)
        if: ${{ !cancelled() }}
        run: |
          rojo sourcemap default.project.json -o sourcemap.json
          luau-lsp analyze --platform=roblox --sourcemap=sourcemap.json \
            --definitions=@roblox="$RUNNER_TEMP/globalTypes.d.luau" src

      - name: Форматирование (StyLua)
        if: ${{ !cancelled() }}
        run: stylua --check src tests

      - name: Линтер (selene)
        if: ${{ !cancelled() }}
        run: selene src
